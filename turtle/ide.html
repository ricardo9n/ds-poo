<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Mini Turtle IDE</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: Arial;
}

#editor {
  width: 50%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #ccc;
}

#controls {
  padding: 10px;
  background: #f5f5f5;
  display: flex;
  gap: 10px;
}

textarea {
  flex: 1;
  width: 100%;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: none;
  outline: none;
  resize: none;
}

#divider {
  width: 6px;
  cursor: col-resize;
  background: #ddd;
}

#canvasContainer {
  flex: 1;
  display: flex;
}

canvas {
  width: 100%;
  height: 100%;
  background: white;
}
</style>
</head>

<body>

<div id="editor">
  <div id="controls">
    <button onclick="novo()">New</button>
    <button onclick="executar()">Run</button>
    <button onclick="download()">Download</button>
    <button onclick="document.getElementById('fileInput').click()">Load</button>
    <button onclick="exemplo()">Exemplos</button>
    <input type="file" id="fileInput" style="display:none" onchange="loadFile(event)" />
  </div>

  <textarea id="code"></textarea>
</div>

<div id="divider"></div>

<div id="canvasContainer">
  <canvas id="tela"></canvas>
</div>

<script src="miniturtle.js"></script>

<script>
// =======================
// LOCAL STORAGE
// =======================

const STORAGE_KEY = "turtle_code";

function salvarAutomatico() {
  localStorage.setItem(STORAGE_KEY, code.value);
}

function carregarSalvo() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) code.value = saved;
}

// salva ao digitar
const code = document.getElementById("code");
code.addEventListener("input", salvarAutomatico);

// =======================
// CANVAS (SEM APAGAR)
// =======================

function resizeCanvas() {
  const canvas = document.getElementById("tela");
  const container = document.getElementById("canvasContainer");

  // salvar imagem atual
  const temp = document.createElement("canvas");
  temp.width = canvas.width;
  temp.height = canvas.height;
  temp.getContext("2d").drawImage(canvas, 0, 0);

  // redimensionar
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;

  // restaurar
  canvas.getContext("2d").drawImage(temp, 0, 0);
}

// =======================
// EXECUTAR + ERRO COM LINHA
// =======================

function executar() {
  try {
    resizeCanvas();
    initTurtle("tela");

    const codigo = code.value;

    new Function(codigo)();

  } catch (e) {
    console.error(e);

    let linha = "?";

    const match = e.stack.match(/<anonymous>:(\d+):\d+/);
    if (match) linha = match[1];

    alert(`Erro na linha ${linha}: ${e.message}`);
  }
}

// =======================
// NEW
// =======================

function novo() {
  if (confirm("Limpar código atual?")) {
    code.value = "";
    salvarAutomatico();
  }
}

// =======================
// DOWNLOAD
// =======================

function download() {
  const blob = new Blob([code.value], { type: "text/javascript" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "script.js";
  a.click();
}

// =======================
// LOAD
// =======================

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = e => {
    code.value = e.target.result;
    salvarAutomatico();
  };

  reader.readAsText(file);
}

// =======================
// EXEMPLOS
// =======================

function exemplo() {
  const ex = `initTurtle("tela");

setColor("blue");
setWidth(3);

for (let i = 0; i < 36; i++) {
  fd(150);
  rt(170);
}`;

  code.value = ex;
  salvarAutomatico();
}

// =======================
// RESIZER
// =======================

const divider = document.getElementById("divider");
const editor = document.getElementById("editor");

let dragging = false;

divider.addEventListener("mousedown", () => dragging = true);
document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", (e) => {
  if (!dragging) return;

  const percent = (e.clientX / window.innerWidth) * 100;

  if (percent > 10 && percent < 90) {
    editor.style.width = percent + "%";
    resizeCanvas();
  }
});

// =======================
// INIT
// =======================

window.addEventListener("resize", resizeCanvas);

carregarSalvo();
resizeCanvas();
initTurtle("tela");

</script>

</body>
</html>
