<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Mini Turtle IDE</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: Arial;
}

/* EDITOR */
#editor {
  width: 50%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #ccc;
}

#controls {
  padding: 10px;
  background: #f5f5f5;
  display: flex;
  gap: 10px;
}

textarea {
  flex: 1;
  width: 100%;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: none;
  outline: none;
  resize: none;
}

/* DIVISOR */
#divider {
  width: 6px;
  cursor: col-resize;
  background: #ddd;
}

/* CANVAS */
#canvasContainer {
  flex: 1;
  display: flex;
}

canvas {
  width: 100%;
  height: 100%;
  background: white;
}
</style>
</head>

<body>

<!-- EDITOR -->
<div id="editor">
  <div id="controls">
    <button onclick="novo()">New</button>
    <button onclick="executar()">Run</button>
    <button onclick="download()">Download</button>
    <button onclick="document.getElementById('fileInput').click()">Load</button>
    <input type="file" id="fileInput" style="display:none" onchange="loadFile(event)" />
  </div>

  <textarea id="code">
initTurtle("tela");

setColor("blue");
setWidth(3);

for (let i = 0; i < 4; i++) {
  fd(100);
  rt(90);
}
  </textarea>
</div>

<!-- DIVISOR -->
<div id="divider"></div>

<!-- CANVAS -->
<div id="canvasContainer">
  <canvas id="tela"></canvas>
</div>

<!-- SUA BIBLIOTECA -->
<script src="miniturtle.js"></script>

<script>
// =======================
// RESIZE CANVAS
// =======================

function resizeCanvas() {
  const canvas = document.getElementById("tela");
  const container = document.getElementById("canvasContainer");

  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
}

// =======================
// EXECUTAR
// =======================

function executar() {
  try {
    resizeCanvas(); // essencial

    initTurtle("tela");

    const codigo = document.getElementById("code").value;
    new Function(codigo)();

  } catch (e) {
    alert("Erro: " + e.message);
    console.error(e);
  }
}

// =======================
// NEW
// =======================

function novo() {
  if (confirm("Limpar código atual?")) {
    document.getElementById("code").value = "";
  }
}

// =======================
// DOWNLOAD
// =======================

function download() {
  const codigo = document.getElementById("code").value;
  const blob = new Blob([codigo], { type: "text/javascript" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "script.js";
  a.click();
}

// =======================
// LOAD
// =======================

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    document.getElementById("code").value = e.target.result;
  };

  reader.readAsText(file);
}

// =======================
// RESIZER (DRAG)
// =======================

const divider = document.getElementById("divider");
const editor = document.getElementById("editor");

let dragging = false;

divider.addEventListener("mousedown", () => {
  dragging = true;
});

document.addEventListener("mouseup", () => {
  dragging = false;
});

document.addEventListener("mousemove", (e) => {
  if (!dragging) return;

  const percent = (e.clientX / window.innerWidth) * 100;

  if (percent > 10 && percent < 90) {
    editor.style.width = percent + "%";
    resizeCanvas(); // atualiza em tempo real
  }
});

// =======================
// INIT
// =======================

window.addEventListener("resize", resizeCanvas);

// inicializa ao abrir
resizeCanvas();
initTurtle("tela");

</script>

</body>
</html>
