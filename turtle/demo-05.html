<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Mini Turtle</title>
    <style>
      body {
        margin: 0;
        background: #eee;
      }
      canvas {
        background: white;
        display: block;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="tela" width="1024" height="768"></canvas>

    <script src="miniturtle.js"></script>

    <script>
      // =======================
      // CASA
      // =======================

      initTurtle("tela");
      setScale(0.5)
      clear(VIOLET);
      setWidth(10);
      rt(36 / 2);
      startFill(YELLOW);

      fd(350);
      rt(144);
      fd(350);
      lt(72);

      fd(350);
      rt(144);
      fd(350);
      lt(72);

      fd(350);
      rt(144);
      fd(350);
      lt(72);

      fd(350);
      rt(144);
      fd(350);
      lt(72);

      fd(350);
      rt(144);
      fd(350);
      lt(72);

      endFill();
      ht();
    </script>
  </body>
</html>
